<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting up {{ school.name }} | Clasyo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%, #020617);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --success-accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .provision-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--primary-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .pulse-orb {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            position: relative;
            box-shadow: 0 0 30px var(--primary-glow);
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px var(--primary-glow);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 45px rgba(99, 102, 241, 0.6);
            }
        }

        .pulse-orb i {
            font-size: 2.4rem;
            color: #ffffff;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.75rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .db-badge {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 4px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.95rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .steps-container {
            margin: 32px 0 24px 0;
            text-align: left;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .step-item.active {
            color: #ffffff;
            font-weight: 600;
        }

        .step-item.completed {
            color: var(--success-accent);
        }

        .step-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .step-item.active .step-icon {
            background: var(--primary-accent);
            color: #ffffff;
        }

        .step-item.completed .step-icon {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-accent);
        }

        .progress-bar-custom {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            width: 15%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .spinner-mini {
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="provision-card">
    <div class="pulse-orb" id="mainIcon">
        <i class="bi bi-database-fill-gear"></i>
    </div>

    <h2 id="mainHeading">Setting up your workspace...</h2>
    <p class="text-muted mb-3">
        Creating dedicated database <span class="db-badge">{{ db_name }}</span>
    </p>

    <div class="steps-container">
        <div class="step-item active" id="step1">
            <div class="step-icon"><span class="spinner-mini"></span></div>
            <span>Creating dedicated database ({{ db_name }})</span>
        </div>
        <div class="step-item" id="step2">
            <div class="step-icon"><i class="bi bi-circle"></i></div>
            <span>Applying academic & institutional schemas</span>
        </div>
        <div class="step-item" id="step3">
            <div class="step-icon"><i class="bi bi-circle"></i></div>
            <span>Setting up school administrator access</span>
        </div>
        <div class="step-item" id="step4">
            <div class="step-icon"><i class="bi bi-circle"></i></div>
            <span>Finalizing workspace configuration</span>
        </div>
    </div>

    <div class="progress-bar-custom">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="text-center mt-3">
        <small class="text-muted" id="statusMessage">Please wait a few moments while we prepare your environment...</small>
    </div>
</div>

<script>
    const schoolSlug = "{{ school.slug }}";
    const provisionApiUrl = "{% url 'tenants:api_provision' school.slug %}";
    const csrfToken = "{{ csrf_token }}";

    function setStep(stepNum, status) {
        const el = document.getElementById(`step${stepNum}`);
        if (!el) return;
        
        if (status === 'active') {
            el.className = 'step-item active';
            el.querySelector('.step-icon').innerHTML = '<span class="spinner-mini"></span>';
        } else if (status === 'completed') {
            el.className = 'step-item completed';
            el.querySelector('.step-icon').innerHTML = '<i class="bi bi-check-lg"></i>';
        }
    }

    function setProgress(percent) {
        document.getElementById('progressFill').style.width = percent + '%';
    }

    async function runProvisioning() {
        setProgress(25);

        // Step 1 to 2 visual transition
        setTimeout(() => {
            setStep(1, 'completed');
            setStep(2, 'active');
            setProgress(50);
        }, 1200);

        try {
            const response = await fetch(provisionApiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                }
            });

            const data = await response.json();

            if (data.success) {
                setStep(2, 'completed');
                setStep(3, 'completed');
                setStep(4, 'active');
                setProgress(90);

                setTimeout(() => {
                    setStep(4, 'completed');
                    setProgress(100);
                    document.getElementById('mainHeading').innerText = "Workspace Ready!";
                    document.getElementById('statusMessage').innerText = "Redirecting to your dashboard...";
                    document.getElementById('mainIcon').innerHTML = '<i class="bi bi-check-circle-fill text-white"></i>';
                    document.getElementById('mainIcon').style.background = 'linear-gradient(135deg, #059669, #10b981)';

                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 900);
                }, 800);
            } else {
                document.getElementById('statusMessage').innerText = "Notice: " + (data.message || 'Setup encountered an error.');
                document.getElementById('statusMessage').className = 'text-danger';
            }
        } catch (err) {
            console.error(err);
            // Fallback: poll status in case background process finished
            pollStatus();
        }
    }

    function pollStatus() {
        const checkUrl = "{% url 'tenants:api_status' school.slug %}";
        const interval = setInterval(async () => {
            try {
                const res = await fetch(checkUrl);
                const statusData = await res.json();
                if (statusData.ready) {
                    clearInterval(interval);
                    window.location.href = statusData.redirect_url;
                }
            } catch(e) {
                // Keep polling
            }
        }, 2000);
    }

    // Launch immediately on page load
    window.addEventListener('DOMContentLoaded', runProvisioning);
</script>

</body>
</html>
