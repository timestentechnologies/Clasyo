<!-- Success/Error/Warning Message Modal - Global Component -->
<style>
/* Global System Message Popup Modal */
#messageModal .modal-dialog {
    max-width: 380px !important;
    margin: 1.75rem auto;
}

.system-msg-modal-content {
    border-radius: 14px !important;
    overflow: hidden !important;
    box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08) !important;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

/* Light Mode Defaults */
:root, [data-theme="light"], body:not(.dark-theme) {
    --sys-msg-modal-bg: #ffffff;
    --sys-msg-modal-header-bg: var(--brand-accent, #0284C7);
    --sys-msg-modal-header-border: rgba(0, 0, 0, 0.08);
    --sys-msg-modal-title: #ffffff;
    --sys-msg-modal-text: #0f172a;
    --sys-msg-modal-subtext: #475569;
    --sys-msg-modal-border: rgba(0, 0, 0, 0.08);
    --sys-msg-close-filter: invert(1) brightness(200%);
}

/* Dark Mode Overrides */
[data-theme="dark"], [data-bs-theme="dark"], .theme-dark, .dark-theme, body.dark-theme, html[data-theme="dark"] {
    --sys-msg-modal-bg: #0f172a;
    --sys-msg-modal-header-bg: var(--brand-accent, #38BDF8);
    --sys-msg-modal-header-border: rgba(255, 255, 255, 0.1);
    --sys-msg-modal-title: #ffffff;
    --sys-msg-modal-text: #f8fafc;
    --sys-msg-modal-subtext: #94a3b8;
    --sys-msg-modal-border: rgba(255, 255, 255, 0.12);
    --sys-msg-close-filter: invert(1) brightness(200%);
}

.system-msg-modal-content {
    background-color: var(--sys-msg-modal-bg) !important;
    color: var(--sys-msg-modal-text) !important;
    border: 1px solid var(--sys-msg-modal-border) !important;
}

/* Force dynamic color accent on modal header across all themes */
#messageModal .modal-header,
#messageModal div.modal-header,
#messageModal .system-msg-modal-header {
    background: var(--brand-accent, #0284C7) !important;
    background-color: var(--brand-accent, #0284C7) !important;
    background-image: none !important;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
    padding: 12px 18px !important;
    color: #ffffff !important;
}

#messageModal .modal-header.msg-theme-error {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
    background-color: #ef4444 !important;
}
#messageModal .modal-header.msg-theme-warning {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
    background-color: #f59e0b !important;
}

#messageModal .modal-header .modal-title,
#messageModal .system-msg-modal-header .modal-title,
#messageModalTitle,
#messageModalTitleText {
    color: #ffffff !important;
    font-size: 0.95rem !important;
    font-weight: 700 !important;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3) !important;
}

#messageModalCloseBtn {
    filter: invert(1) brightness(200%) !important;
    font-size: 0.8rem !important;
    opacity: 0.9 !important;
}
#messageModalCloseBtn:hover {
    opacity: 1 !important;
}

/* Remove icon completely */
.system-msg-icon-box,
#messageModalIconWrap,
#messageModalIcon {
    display: none !important;
}

.system-msg-modal-content .modal-body {
    color: var(--sys-msg-modal-subtext) !important;
    font-size: 0.875rem !important;
    line-height: 1.55 !important;
    padding: 16px 18px !important;
}

.system-msg-modal-content .modal-footer {
    padding: 6px 18px 16px !important;
    border-top: none !important;
}

#messageModalBtn {
    background-color: var(--brand-accent, #0284C7) !important;
    border-color: var(--brand-accent, #0284C7) !important;
    color: #ffffff !important;
    font-weight: 600 !important;
    min-width: 80px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
}
</style>

<div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalTitleText" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
        <div class="modal-content system-msg-modal-content border-0 shadow-lg">
            <div class="modal-header system-msg-modal-header py-2 px-3 border-0 d-flex align-items-center justify-content-between" id="messageModalHeader">
                <h5 class="modal-title mb-0" id="messageModalTitle">
                    <span id="messageModalTitleText">Notification</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="messageModalCloseBtn"></button>
            </div>
            <div class="modal-body py-3 px-3" id="messageModalBody">
                <p class="mb-0" id="messageModalText">Operation completed successfully!</p>
            </div>
            <div class="modal-footer border-0 pt-0 pb-3 px-3 d-flex justify-content-end">
                <button type="button" class="btn btn-primary btn-sm px-3 fw-semibold shadow-sm" data-bs-dismiss="modal" id="messageModalBtn" style="border-radius: 6px; min-width: 76px;">OK</button>
            </div>
        </div>
    </div>
</div>
