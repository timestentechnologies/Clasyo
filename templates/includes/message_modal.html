<!-- Success/Error/Warning Message Modal - Global Component -->
<style>
/* Global System Message Popup Modal */
#messageModal .modal-dialog {
    max-width: 380px !important;
    margin: 1.75rem auto;
}

.system-msg-modal-content {
    border-radius: 14px !important;
    overflow: hidden !important;
    box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08) !important;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

/* Light Mode Defaults */
:root, [data-theme="light"], body:not(.dark-theme) {
    --sys-msg-modal-bg: #ffffff;
    --sys-msg-modal-header-bg: var(--brand-accent, #0284C7);
    --sys-msg-modal-header-border: rgba(0, 0, 0, 0.08);
    --sys-msg-modal-title: #ffffff;
    --sys-msg-modal-text: #0f172a;
    --sys-msg-modal-subtext: #475569;
    --sys-msg-modal-border: rgba(0, 0, 0, 0.08);
    --sys-msg-close-filter: invert(1) brightness(200%);
}

/* Dark Mode Overrides */
[data-theme="dark"], [data-bs-theme="dark"], .theme-dark, .dark-theme, body.dark-theme, html[data-theme="dark"] {
    --sys-msg-modal-bg: #0f172a;
    --sys-msg-modal-header-bg: var(--brand-accent, #38BDF8);
    --sys-msg-modal-header-border: rgba(255, 255, 255, 0.1);
    --sys-msg-modal-title: #ffffff;
    --sys-msg-modal-text: #f8fafc;
    --sys-msg-modal-subtext: #94a3b8;
    --sys-msg-modal-border: rgba(255, 255, 255, 0.12);
    --sys-msg-close-filter: invert(1) brightness(200%);
}

.system-msg-modal-content {
    background-color: var(--sys-msg-modal-bg) !important;
    color: var(--sys-msg-modal-text) !important;
    border: 1px solid var(--sys-msg-modal-border) !important;
}

/* Force dynamic color accent on modal header across all themes */
#messageModal .modal-header,
#messageModal div.modal-header,
#messageModal .system-msg-modal-header {
    background: var(--brand-accent, #0284C7) !important;
    background-color: var(--brand-accent, #0284C7) !important;
    background-image: none !important;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
    padding: 12px 18px !important;
    color: #ffffff !important;
}

#messageModal .modal-header.msg-theme-error {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
    background-color: #ef4444 !important;
}
#messageModal .modal-header.msg-theme-warning {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
    background-color: #f59e0b !important;
}

#messageModal .modal-header .modal-title,
#messageModal .system-msg-modal-header .modal-title,
#messageModalTitle,
#messageModalTitleText {
    color: #ffffff !important;
    font-size: 0.95rem !important;
    font-weight: 700 !important;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3) !important;
}

#messageModalCloseBtn {
    filter: invert(1) brightness(200%) !important;
    font-size: 0.8rem !important;
    opacity: 0.9 !important;
}
#messageModalCloseBtn:hover {
    opacity: 1 !important;
}

/* Remove icon completely */
.system-msg-icon-box,
#messageModalIconWrap,
#messageModalIcon {
    display: none !important;
}

.system-msg-modal-content .modal-body {
    color: var(--sys-msg-modal-subtext) !important;
    font-size: 0.875rem !important;
    line-height: 1.55 !important;
    padding: 16px 18px !important;
}

.system-msg-modal-content .modal-footer {
    padding: 6px 18px 16px !important;
    border-top: none !important;
}

#messageModalBtn {
    background-color: var(--brand-accent, #0284C7) !important;
    border-color: var(--brand-accent, #0284C7) !important;
    color: #ffffff !important;
    font-weight: 600 !important;
    min-width: 80px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
}
</style>

<div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalTitleText" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
        <div class="modal-content system-msg-modal-content border-0 shadow-lg">
            <div class="modal-header system-msg-modal-header py-2 px-3 border-0 d-flex align-items-center justify-content-between" id="messageModalHeader">
                <h5 class="modal-title mb-0" id="messageModalTitle">
                    <span id="messageModalTitleText">Notification</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="messageModalCloseBtn"></button>
            </div>
            <div class="modal-body py-3 px-3" id="messageModalBody">
                <p class="mb-0" id="messageModalText">Operation completed successfully!</p>
            </div>
            <div class="modal-footer border-0 pt-0 pb-3 px-3 d-flex justify-content-end">
                <button type="button" class="btn btn-primary btn-sm px-3 fw-semibold shadow-sm" data-bs-dismiss="modal" id="messageModalBtn" style="border-radius: 6px; min-width: 76px;">OK</button>
            </div>
        </div>
    </div>
</div>

<!-- Global System Confirmation Modal -->
<div class="modal fade" id="systemConfirmModal" tabindex="-1" aria-labelledby="systemConfirmModalTitleText" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
        <div class="modal-content system-msg-modal-content border-0 shadow-lg">
            <div class="modal-header system-msg-modal-header py-2 px-3 border-0 d-flex align-items-center justify-content-between" id="systemConfirmModalHeader" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;">
                <h5 class="modal-title mb-0 d-flex align-items-center" id="systemConfirmModalTitle" style="color: #ffffff !important; font-size: 0.95rem; font-weight: 700;">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="systemConfirmModalTitleText">Confirm Action</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="systemConfirmModalCloseBtn" style="filter: invert(1) brightness(200%);"></button>
            </div>
            <div class="modal-body py-3 px-3" id="systemConfirmModalBody">
                <p class="mb-0 text-muted" id="systemConfirmModalText">Are you sure you want to proceed?</p>
            </div>
            <div class="modal-footer border-0 pt-0 pb-3 px-3 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary btn-sm px-3 fw-semibold shadow-sm" data-bs-dismiss="modal" id="systemConfirmModalCancelBtn" style="border-radius: 6px;">Cancel</button>
                <button type="button" class="btn btn-danger btn-sm px-3 fw-semibold shadow-sm" id="systemConfirmModalOkBtn" style="border-radius: 6px;">Confirm</button>
            </div>
        </div>
    </div>
</div>

<script>
window.showConfirmModal = function(options) {
    var modalEl = document.getElementById('systemConfirmModal');
    if (!modalEl || typeof bootstrap === 'undefined') {
        if (confirm(options.message || 'Are you sure?')) {
            if (options.onConfirm) options.onConfirm();
            else if (options.href) window.location.href = options.href;
            else if (options.form) options.form.submit();
        }
        return;
    }

    document.getElementById('systemConfirmModalTitleText').textContent = options.title || 'Confirm Action';
    document.getElementById('systemConfirmModalText').textContent = options.message || 'Are you sure you want to proceed?';
    
    var okBtn = document.getElementById('systemConfirmModalOkBtn');
    okBtn.textContent = options.confirmText || 'Confirm';
    okBtn.className = 'btn btn-sm px-3 fw-semibold shadow-sm ' + (options.confirmClass || 'btn-danger');

    var bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);

    // Replace button to drop existing listeners
    var newOkBtn = okBtn.cloneNode(true);
    okBtn.parentNode.replaceChild(newOkBtn, okBtn);

    newOkBtn.addEventListener('click', function() {
        bsModal.hide();
        if (options.onConfirm) {
            options.onConfirm();
        } else if (options.href) {
            window.location.href = options.href;
        } else if (options.form) {
            options.form.submit();
        }
    });

    bsModal.show();
};

document.addEventListener('DOMContentLoaded', function() {
    // Intercept native alert() to use global styled message modal
    window.alert = function(msg) {
        if (typeof window.showMessage === 'function') {
            window.showMessage('Notice', String(msg), false, null, 'info');
        } else {
            var modalEl = document.getElementById('messageModal');
            if (modalEl && typeof bootstrap !== 'undefined') {
                var title = document.getElementById('messageModalTitleText');
                if (title) title.textContent = 'Notice';
                var text = document.getElementById('messageModalText');
                if (text) text.textContent = String(msg);
                var bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);
                bsModal.show();
            }
        }
    };

    document.addEventListener('click', function(e) {
        var target = e.target.closest('[data-confirm]');
        if (target) {
            e.preventDefault();
            e.stopPropagation();
            var message = target.getAttribute('data-confirm');
            var title = target.getAttribute('data-confirm-title') || 'Confirm Action';
            var confirmText = target.getAttribute('data-confirm-btn') || 'Confirm';
            var confirmClass = target.getAttribute('data-confirm-class') || 'btn-danger';
            var href = target.getAttribute('href');
            var form = target.closest('form');
            var btnName = target.getAttribute('name');
            var btnValue = target.getAttribute('value');

            window.showConfirmModal({
                title: title,
                message: message,
                confirmText: confirmText,
                confirmClass: confirmClass,
                href: (href && href !== '#' ? href : null),
                onConfirm: function() {
                    if (form) {
                        if (btnName) {
                            var hidden = form.querySelector('input[name="' + btnName + '"][data-temp-submit="true"]');
                            if (!hidden) {
                                hidden = document.createElement('input');
                                hidden.type = 'hidden';
                                hidden.name = btnName;
                                hidden.setAttribute('data-temp-submit', 'true');
                                form.appendChild(hidden);
                            }
                            hidden.value = btnValue || '';
                        }
                        form.submit();
                    } else if (href && href !== '#') {
                        window.location.href = href;
                    }
                }
            });
        }
    });
});
</script>
