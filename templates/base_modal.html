{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4DD0E1">
    {% if system_settings.school_favicon %}
    <link rel="icon" type="image/png" href="{{ system_settings.school_favicon.url }}">
    <link rel="shortcut icon" href="{{ system_settings.school_favicon.url }}" type="image/x-icon">
    {% else %}
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" type="image/png" href="{% static 'images/erpupdated.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/erpupdated.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/erpupdated.png' %}">
    <link rel="apple-touch-icon" sizes="192x192" href="{% static 'images/erpupdated.png' %}">
    <link rel="apple-touch-icon" sizes="512x512" href="{% static 'images/erpupdated.png' %}">
    {% endif %}
    <title>{% block title %}School Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
