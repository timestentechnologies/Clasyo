{% extends "frontend/base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Authentication Error - Clasyo{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0" style="border-radius: 20px; overflow: hidden;">
                <div class="card-header text-center py-4 bg-danger text-white">
                    <div class="mb-2">
                        <i class="fas fa-exclamation-triangle fa-2x"></i>
                    </div>
                    <h5 class="fw-bold mb-0">Authentication Problem</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="text-muted mb-4">
                        An error occurred while attempting to sign in with your third-party account.
                    </p>
                    <div class="d-grid gap-2">
                        <a href="{% url 'frontend:home' %}" class="btn btn-primary py-2" style="border-radius: 8px;">
                            <i class="fas fa-home me-2"></i> Return to Homepage
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
