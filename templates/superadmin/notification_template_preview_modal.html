<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .device-container { max-width: 440px; margin: 0 auto; }
        .message-bubble {
            border-radius: 12px;
            padding: 16px;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
        }
        .bubble-sms { background: #ffffff; border: 1px solid #e2e8f0; color: #1e293b; }
        .bubble-whatsapp { background: #dcf8c6; border: 1px solid #c2e2ab; color: #0b4122; }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="text-center mb-3">
            <span class="badge {% if template.channel == 'whatsapp' %}bg-success{% else %}bg-warning text-dark{% endif %} px-3 py-2">
                <i class="{% if template.channel == 'whatsapp' %}fab fa-whatsapp{% else %}fas fa-sms{% endif %} me-1"></i>
                {{ template.get_channel_display }} Preview
            </span>
        </div>

        <div class="card border shadow-sm">
            <div class="card-header bg-dark text-white p-2 d-flex justify-content-between align-items-center">
                <small class="fw-semibold">{{ template.school.name|default:"School SMS Gateway" }}</small>
                <small class="text-white-50">Just now</small>
            </div>
            <div class="card-body p-3" style="background-color: #e5ddd5;">
                <div class="message-bubble {% if template.channel == 'whatsapp' %}bubble-whatsapp{% else %}bubble-sms{% endif %}">
                    {{ rendered_body }}
                </div>
            </div>
        </div>

        <div class="mt-4 p-3 bg-white rounded-3 border">
            <h6 class="fw-bold mb-2 small text-uppercase text-muted">Interpolated Sample Data</h6>
            <div class="small text-muted font-monospace" style="max-height: 140px; overflow-y: auto;">
                {% for k, v in sample_context.items %}
                    <div><strong>{{ k }}</strong>: {{ v }}</div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
